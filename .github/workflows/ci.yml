name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # No "services: postgres" block on purpose. The DAO tests start their own PostgreSQL
      # container through Testcontainers and the Docker daemon already available on
      # ubuntu-latest, exactly as they do locally, so nothing is provisioned by the workflow.
      - name: Build and test the whole reactor
        run: ./mvnw -B verify

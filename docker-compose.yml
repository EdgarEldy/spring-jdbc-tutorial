# Runs the PACKAGED WAR (Tomcat 10.1) with a real PostgreSQL 16. It is not used for the tests:
# the DAO tests start their own PostgreSQL through Testcontainers.
#
# Before the first "docker compose up --build":
#   1. cp .env.example .env and set DB_PASSWORD (there is no default password on purpose)
#   2. from the feature/auth branch on, create a production RSA key pair in ./keys (the keys under
#      dev-keys/ are for development only):
#        mkdir -p keys
#        openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out keys/privateKey.pem
#        openssl pkey -in keys/privateKey.pem -pubout -out keys/publicKey.pem
#        chmod 644 keys/*.pem
#      The container runs as an unprivileged user whose uid differs from yours, so the keys must
#      be readable by others. The keys directory is ignored by git and mounted read-only.
#
# The API is then served at http://localhost:${APP_PORT}/spring-jdbc-tutorial/api/v1/...

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-spring_jdbc_tutorial}
      POSTGRES_USER: ${DB_USER:-spring}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-spring} -d ${DB_NAME:-spring_jdbc_tutorial}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Spring reads these through Environment: APP_DATASOURCE_URL is the property app.datasource.url
      APP_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-spring_jdbc_tutorial}
      APP_DATASOURCE_USERNAME: ${DB_USER:-spring}
      APP_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  db-data:
